<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERNOS DE GRUPO COMBINADOS EM 5</title>
    <style>
        /* CONFIGURAÇÃO VISUAL: PRETO E VERMELHO */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none; /* Dificulta cópia de texto */
        }

        /* CONTAINER PRINCIPAL */
        .container { 
            max-width: 800px; 
            margin: auto; 
            border: 2px solid #ff0000; 
            padding: 20px; 
            border-radius: 15px; 
            background: #0a0a0a; 
        }

        h1 { color: #ff0000; text-transform: uppercase; margin-bottom: 20px; }

        /* TELAS DE LOGIN E BLOQUEIO */
        #login-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
        }

        .status-box {
            border: 2px solid #ff0000;
            padding: 30px;
            border-radius: 15px;
            background: #111;
        }

        .login-input {
            padding: 12px;
            width: 250px;
            background: #000;
            border: 1px solid #ff0000;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* GRID DE SELEÇÃO (1 A 25) */
        .grid-numbers { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            margin-bottom: 20px; 
        }

        .num-btn { 
            background: #1a1a1a; 
            border: 1px solid #ff000033; 
            color: white; 
            padding: 12px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-weight: bold; 
            transition: 0.3s;
        }

        .num-btn.selected { 
            background: #ff0000; 
            border-color: #fff; 
            box-shadow: 0 0 10px #ff0000; 
        }

        /* CONFERIDOR */
        .conferidor-area { 
            background: #111; 
            padding: 20px; 
            border-radius: 10px; 
            margin: 25px 0; 
            border: 1px dashed #ff0000; 
        }

        .conf-input { 
            width: 50px; 
            padding: 10px; 
            text-align: center; 
            background: #000; 
            color: #ff0000; 
            border: 1px solid #ff0000; 
            margin: 5px; 
            border-radius: 5px; 
            font-size: 1.1rem;
        }

        /* BOTÕES DE AÇÃO */
        .btn-action { 
            background: #ff0000; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            cursor: pointer; 
            border-radius: 5px; 
            margin: 5px; 
            font-weight: bold; 
            text-transform: uppercase; 
        }

        /* RESULTADOS E DESTAQUE */
        .results { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 12px; 
            margin-top: 25px; 
        }

        .game-card { 
            background: #151515; 
            padding: 12px; 
            border: 1px solid #333; 
            border-radius: 6px; 
            font-size: 0.9rem; 
        }

        .highlight { 
            border: 2px solid #00ff00 !important; 
            background: #002200 !important; 
            transform: scale(1.05); 
        }

        /* POPUP ANIMADO */
        #popup-win { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
        }

        .popup-content { 
            background: #000; 
            border: 4px solid #ff0000; 
            padding: 40px; 
            border-radius: 20px; 
            animation: popupShow 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        @keyframes popupShow { 
            0% { transform: scale(0.5); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }

        /* RODAPÉ E BADGE */
        #demo-badge { 
            background: #ff0000; 
            padding: 5px; 
            font-size: 0.8rem; 
            font-weight: bold; 
            margin-bottom: 15px; 
            display: none; 
        }

        footer { margin-top: 40px; color: #555; font-size: 0.8rem; border-top: 1px solid #222; padding: 20px; }

        #main-app { display: none; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- POPUP DE VITÓRIA -->
    <div id="popup-win">
        <div class="popup-content">
            <h2 style="color: #00ff00;">🎯 EXCELENTE!</h2>
            <div id="popup-message" style="font-size: 1.2rem; margin-bottom: 20px;"></div>
            <button class="btn-action" onclick="closePopup()">CONTINUAR</button>
        </div>
    </div>

    <!-- TELA DE ACESSO / BLOQUEIO -->
    <div id="login-screen">
        <div class="status-box">
            <h2 style="color: #ff0000;">SISTEMA BLOQUEADO</h2>
            <p>O período de teste terminou ou o acesso é restrito.<br>Insira a senha mestra:</p>
            <input type="password" id="password-input" class="login-input" placeholder="DIGITE A SENHA">
            <br>
            <button class="btn-action" onclick="verifyPassword()">LIBERAR AGORA</button>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <div id="main-app">
        <div class="container">
            <div id="demo-badge">MODO DEMONSTRAÇÃO ATIVO</div>
            <h1>TERNOS DE GRUPO COMBINADOS EM 5</h1>
            
            <p>Escolha 16 dezenas para gerar o fechamento:</p>
            <div class="grid-numbers" id="selector"></div>

            <div>
                <button class="btn-action" onclick="clearAll()">Limpar Seleção</button>
                <button class="btn-action" onclick="shareResults()">Compartilhar Jogos</button>
            </div>

            <div class="conferidor-area">
                <h3>CONFERIDOR DE RESULTADO</h3>
                <input type="number" class="conf-input" placeholder="1º">
                <input type="number" class="conf-input" placeholder="2º">
                <input type="number" class="conf-input" placeholder="3º">
                <input type="number" class="conf-input" placeholder="4º">
                <input type="number" class="conf-input" placeholder="5º">
                <br>
                <button class="btn-action" style="background: #333; border: 1px solid #ff0000;" onclick="checkGames()">CONFERIR TERNOS</button>
            </div>

            <div id="display-results" class="results"></div>

            <footer>Criado por Guinho Do Bicho</footer>
        </div>
    </div>

    <script>
        const MASTER_PASS = "TERNODEGRUPOCOMBINADO";
        const LIMIT = 3;

        // INICIALIZAÇÃO E CONTROLE DE ACESSO
        window.onload = function() {
            const isVIP = localStorage.getItem("guinho_access") === "true";
            
            if (isVIP) {
                showApp(false);
            } else {
                let count = parseInt(localStorage.getItem("demo_count") || "0");
                if (count < LIMIT) {
                    count++;
                    localStorage.setItem("demo_count", count);
                    showApp(true, count);
                } else {
                    document.getElementById("login-screen").style.display = "flex";
                }
            }
        };

        function verifyPassword() {
            const input = document.getElementById("password-input").value;
            if (input === MASTER_PASS) {
                localStorage.setItem("guinho_access", "true");
                location.reload(); 
            } else {
                alert("Senha Inválida!");
            }
        }

        function showApp(isDemo, count) {
            document.getElementById("main-app").style.display = "block";
            if (isDemo) {
                const badge = document.getElementById("demo-badge");
                badge.style.display = "block";
                badge.innerText = `MODO DEMO: ACESSO ${count} DE ${LIMIT}`;
            }
            initSelector();
        }

        /* LÓGICA DE FECHAMENTO */
        const matrix = [
            [1,2,3,5,12],[1,2,13,14,15],[1,3,10,12,16],[1,4,8,9,14],[1,4,10,12,13],
            [1,4,10,13,15],[1,5,11,12,15],[1,6,9,10,14],[2,3,4,12,16],[2,3,5,6,15],
            [2,3,6,8,10],[2,4,6,8,16],[2,4,9,12,15],[2,5,10,11,14],[2,6,9,12,13],
            [3,4,7,13,14],[3,5,13,14,15],[3,6,11,13,14],[3,9,10,12,13],[4,5,11,15,16],
            [4,6,7,11,12],[5,6,7,9,16],[5,7,8,13,15],[5,8,9,10,11],[6,8,12,14,15],
            [7,8,10,11,16],[7,9,11,15,16]
        ];

        let selected = [];

        function initSelector() {
            const div = document.getElementById('selector');
            for (let i = 1; i <= 25; i++) {
                let btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i.toString().padStart(2, '0');
                btn.onclick = () => {
                    if (selected.includes(i)) {
                        selected = selected.filter(n => n !== i);
                        btn.classList.remove('selected');
                    } else if (selected.length < 16) {
                        selected.push(i);
                        btn.classList.add('selected');
                    }
                    renderGames();
                };
                div.appendChild(btn);
            }
        }

        function renderGames() {
            const container = document.getElementById('display-results');
            container.innerHTML = '';
            if (selected.length < 16) return;

            const sorted = [...selected].sort((a,b) => a-b);
            matrix.forEach((row, i) => {
                const game = row.map(pos => sorted[pos-1]);
                const card = document.createElement('div');
                card.className = 'game-card';
                card.id = `g-${i}`;
                card.innerText = game.map(n => n.toString().padStart(2,'0')).join(' - ');
                container.appendChild(card);
            });
        }

        function checkGames() {
            const draws = Array.from(document.querySelectorAll('.conf-input'))
                               .map(i => parseInt(i.value))
                               .filter(n => !isNaN(n));
            
            if (selected.length < 16 || draws.length < 5) {
                alert("Selecione 16 dezenas e preencha o resultado de 5 números.");
                return;
            }

            let wins = 0;
            const sorted = [...selected].sort((a,b) => a-b);

            matrix.forEach((row, i) => {
                const game = row.map(pos => sorted[pos-1]);
                const hits = game.filter(n => draws.includes(n)).length;
                const card = document.getElementById(`g-${i}`);
                
                if (hits >= 3) {
                    wins++;
                    card.classList.add('highlight');
                    card.innerHTML = `${game.map(n => n.toString().padStart(2,'0')).join(' - ')}<br><strong>✅ ${hits} ACERTOS</strong>`;
                } else {
                    card.classList.remove('highlight');
                    card.innerText = game.map(n => n.toString().padStart(2,'0')).join(' - ');
                }
            });

            if (wins > 0) {
                document.getElementById('popup-message').innerText = `PARABENS POIS ACERTOU ${wins} TERNOS DE GRUPO!`;
                document.getElementById('popup-win').style.display = 'flex';
            }
        }

        function closePopup() { document.getElementById('popup-win').style.display = 'none'; }

        function clearAll() {
            selected = [];
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('.conf-input').forEach(i => i.value = '');
            renderGames();
        }

        function shareResults() {
            const text = document.getElementById('display-results').innerText;
            if (selected.length < 16) return;
            if (navigator.share) {
                navigator.share({ title: 'Meus Ternos', text: "Gerado por Guinho Do Bicho:\n\n" + text });
            } else {
                navigator.clipboard.writeText(text);
                alert("Jogos copiados!");
            }
        }

        // BLOQUEIO DE TECLAS (F12 / CTRL+U)
        document.onkeydown = (e) => {
            if (e.keyCode == 123 || (e.ctrlKey && e.keyCode == 85)) return false;
        };
    </script>
</body>
</html>
